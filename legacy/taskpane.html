<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Livedoc Variables</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- formulajs requires these three globals loaded first -->
  <script src="/node_modules/numeric/numeric-1.2.6.min.js"></script>
  <script src="/node_modules/numeral/min/numeral.min.js"></script>
  <script src="/node_modules/jStat/dist/jstat.min.js"></script>
  <script src="/node_modules/formulajs/dist/formula.standalone.min.js"></script>
  <link rel="stylesheet" href="taskpane.css"/>
</head>
<body>

<div id="loading" class="loading-screen">
  <div class="loading-spinner"></div>
  <p>Initializing…</p>
</div>

<div id="app" style="display:none">

  <!-- Header -->
  <header class="app-header">
    <span class="header-icon">LV</span>
    <span class="header-title">Variable Panel</span>
    <button class="icon-btn" onclick="refreshFromDoc()" title="Reload from document">&#8635;</button>
  </header>

  <!-- Search -->
  <div class="search-bar">
    <span class="search-icon">&#128269;</span>
    <input id="searchInput" class="search-input" type="text" placeholder="Search variables&hellip;" spellcheck="false" autocomplete="off"/>
  </div>

  <!-- Panel header bar -->
  <div class="panel-header-bar">
    <span class="panel-tab-label">Local</span>
    <span class="spacer"></span>
    <span id="varCount" class="count-badge">0</span>
    <div class="add-dropdown-wrap">
      <button class="btn-preview"  onclick="previewDoc()"            title="Preview — replace all {{tokens}} and download PPTX">&#9654;</button>
      <button class="btn-dynamic"  onclick="openDynamicDrawer()"     title="Dynamic table — link a shape to a table variable">&#8862;</button>
      <button class="btn-dynimage" onclick="openDynamicImageDrawer()" title="Dynamic image — tag a shape as an image placeholder">&#128247;</button>
      <button class="btn-dynchart" onclick="openDynamicChartDrawer()" title="Dynamic chart — link a chart to table variable data">&#128202;</button>
    <button id="addBtn" class="btn-add">+ Add &#9662;</button>
      <div id="addMenu" class="add-menu hidden">
        <button onclick="openAddDrawer('scalar')"><span class="menu-badge badge-NUMBER">123</span> Scalar Variable</button>
        <button onclick="openAddDrawer('table')"><span class="menu-badge badge-TABLE">TBL</span> Table Variable</button>
        <button onclick="openAddDrawer('computed')"><span class="menu-badge badge-COMPUTED">fx</span> Computed Variable</button>
        <button onclick="openAddDrawer('system')"><span class="menu-badge badge-SYSTEM">SYS</span> System Variable</button>
      </div>
    </div>
  </div>

  <!-- Unified tree -->
  <div id="varTree" class="tree-body"></div>

  <!-- Edit / Add drawer (slides up from bottom) -->
  <div id="editDrawer" class="edit-drawer collapsed">
    <div class="drawer-header">
      <span id="drawerTitle" class="drawer-title">Add Variable</span>
      <button class="drawer-close" onclick="closeDrawer()">&#10005;</button>
    </div>
    <div id="drawerForm" class="drawer-form"></div>
    <div class="drawer-actions">
      <button id="drawerSaveBtn" class="btn-primary" onclick="saveDrawer()">Save</button>
      <button class="btn-secondary" onclick="closeDrawer()">Cancel</button>
    </div>
  </div>

  <!-- Status bar -->
  <div id="status" class="status-bar" style="display:none"></div>

</div>

<script src="state.js"></script>
<script src="utils.js"></script>
<script src="pptx-utils.js"></script>
<script src="xml-storage.js"></script>
<script src="computed.js"></script>
<script src="variables.js"></script>
<script src="selection.js"></script>
<script src="dynamic-table.js"></script>
<script src="dynamic-image.js"></script>
<script src="dynamic-chart.js"></script>
<script src="preview.js"></script>
<script src="taskpane.js"></script>
</body>
</html>
